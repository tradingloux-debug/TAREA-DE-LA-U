<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 22 392 196" width="392" height="196" fill="none">
  <!-- GIA EXPERIENCES OFFICIAL WORDMARK LOGO (WHITE VERSION FOR DARK BACKGROUNDS) -->
  
  <defs>
    <!-- Turquoise ocean wave gradient -->
    <linearGradient id="waveTurquoiseWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="40%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#26C6DA"/>
    </linearGradient>

    <!-- White gap mask around the wave to create the precise cutout in the A -->
    <mask id="cutoutAWhite">
      <rect width="460" height="220" fill="white"/>
      <path d="
        M 260 168
        C 285 148 318 120 354 104
        C 378 94 402 96 434 116
        C 434 140 405 152 376 144
        C 342 136 308 152 270 182
        Z
      " fill="black"/>
    </mask>
  </defs>

  <!-- ============================================== -->
  <!-- 1. GIA LETTERS (Pure Crisp White #FFFFFF)       -->
  <!-- ============================================== -->
  <g id="gia-letters-white" fill="#FFFFFF">
    <!-- LETRA "G" -->
    <path d="
      M 112 25
      C 72 25 40 57 40 95
      C 40 133 72 165 112 165
      C 146 165 172 142 179 112
      L 142 112
      C 137 124 126 132 112 132
      C 90 132 74 115 74 95
      C 74 75 90 58 112 58
      C 127 58 138 67 143 80
      L 179 80
      C 172 49 146 25 112 25
      Z
    "/>
    <path d="M 110 88 H 178 V 112 H 110 Z"/>

    <!-- LETRA "I" -->
    <rect x="206" y="27" width="34" height="136" rx="1"/>

    <!-- LETRA "A" CON MÁSCARA DE RECORTE -->
    <g mask="url(#cutoutAWhite)">
      <path d="
        M 346 27
        L 282 163
        H 318
        L 332 133
        H 360
        L 374 163
        H 410
        L 346 27
        Z
        M 346 64
        L 354 112
        H 338
        L 346 64
        Z
      "/>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 2. OLA TURQUESA EN LA "A"                      -->
  <!-- ============================================== -->
  <g id="wave-swoosh-white">
    <path d="
      M 268 168
      C 288 150 318 126 352 112
      C 376 102 398 104 424 122
      C 406 138 384 138 364 128
      C 338 116 308 134 278 174
      Z
    " fill="url(#waveTurquoiseWhite)"/>

    <path d="
      M 292 144
      C 316 126 342 114 366 112
      C 386 110 404 114 420 123
      C 404 128 388 126 372 121
      C 348 114 322 126 292 144
      Z
    " fill="#E0F7FA" opacity="0.6"/>
  </g>

